# Bronze and silver, then gold, run whenever new trade files land in the raw volume.
# Notebook paths are relative to this file; the bundle uploads the notebooks
# together with src/, which the notebooks import from.
resources:
  jobs:
    microstructure_pipeline:
      name: microstructure-pipeline

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/workspace/microstructure/raw/trades/

      # Starts a little slower than PERFORMANCE_OPTIMIZED but uses less of the
      # Free Edition compute quota; nothing here is waiting on start-up time.
      performance_target: STANDARD

      queue:
        enabled: true

      parameters:
        - name: catalog
          default: workspace
        - name: schema
          default: microstructure

      tasks:
        - task_key: Bronze_and_Silver
          notebook_task:
            notebook_path: ../notebooks/01_bronze_silver.py

        - task_key: Gold
          depends_on:
            - task_key: Bronze_and_Silver
          notebook_task:
            notebook_path: ../notebooks/02_gold.py
